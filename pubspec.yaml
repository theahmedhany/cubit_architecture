name: cubit_architecture
description: "A New Cubit Architecture Flutter Project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # UI & Animations
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  loading_animation_widget: ^1.3.0
  pinput: ^6.0.2
  animate_do: ^5.1.0
  lottie: ^3.3.3

  # State Management
  flutter_bloc: ^8.0.1

  # Networking
  dio: ^5.9.2
  retrofit: ^4.9.2
  pretty_dio_logger: ^1.4.0

  # Dependency Injection
  get_it: ^9.2.1

  # Local Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.0

  # Localization
  easy_localization: ^3.0.8
  intl: ^0.20.2

  # Firebase
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^21.0.0

  # Authentication
  flutter_facebook_auth: ^7.1.6
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.0.0

  # Device & Permissions
  connectivity_plus: ^7.1.1
  device_info_plus: ^12.4.0
  device_security_check: ^0.1.1
  permission_handler: ^12.0.1
  sensors_plus: ^7.0.0

  # Location
  geolocator: ^14.0.2

  # Files & Images
  cached_network_image: ^3.4.1
  file_picker: ^11.0.2
  image_picker: ^1.2.2

  # Serialization
  json_annotation: ^4.12.0
  jwt_decoder: ^2.0.1

  # App Information
  package_info_plus: ^9.0.0

  # URL
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.15.0
  json_serializable: ^6.14.0
  retrofit_generator: ^10.2.6

flutter:
  uses-material-design: true

  assets:
    - assets/lang/
    - assets/fonts/
    - assets/images/
    - assets/icons/
    - assets/master/
    - assets/lottie/
    - assets/gif/
    - assets/dummy/

